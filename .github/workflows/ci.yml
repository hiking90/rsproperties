name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run dependency checks weekly on Sundays at 02:00 UTC
    - cron: '0 2 * * 0'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-stable-
          ${{ runner.os }}-cargo-

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Build
      run: cargo build --verbose --all-features

    # `--features builder`, not `--all-features`: the strict-file-validation
    # feature enforces the root-ownership check on property files even in
    # debug builds, so test fixtures created by the non-root CI user would
    # be rejected. The Build/clippy/docs jobs still compile with
    # --all-features, so the strict feature keeps compile coverage.
    - name: Run tests
      run: cargo test --verbose --features builder

    # Note: Release mode tests are skipped in CI because they enforce
    # strict file ownership validation (root ownership) which fails
    # in GitHub Actions environment. This is intentional security behavior.
    # - name: Run tests (release mode)
    #   run: cargo test --verbose --features builder --release

    # Build only: getprop needs a property area to read, and running it
    # without arguments exits 1.
    - name: Build workspace examples
      run: |
        cd rsproperties
        cargo build --example getprop --features=builder

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-coverage-
          ${{ runner.os }}-cargo-

    # --features builder, not --all-features: strict-file-validation would
    # make area-creating tests fail as non-root (see the Test job note).
    - name: Generate coverage report
      run: cargo llvm-cov --features builder --workspace --lcov --output-path lcov.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: lcov.info
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-build-
          ${{ runner.os }}-cargo-

    - name: Build
      run: cargo build --verbose --all-features

    - name: Build examples
      run: cargo build --examples --verbose --all-features

    - name: Check benches compilation
      run: cargo check --benches --all-features

  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust 1.77 (MSRV)
      uses: dtolnay/rust-toolchain@1.77

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-msrv-

    # The committed manifests and Cargo.lock as they are. Cargo.lock must
    # stay `version = 3`: cargo 1.77 cannot read v4 (stable since 1.78).
    - name: Check MSRV
      run: cargo check --locked --all-features

    # Lib unit tests build the dev-dependencies, and two of them cannot be
    # built by 1.77: clap 4.6 is edition 2024 (cargo 1.77 cannot parse its
    # manifest) and criterion 0.8 declares rust-version 1.86. Remove them
    # in this CI checkout only (nothing is committed); `cargo remove` also
    # prunes Cargo.lock, so `--locked` below still holds. If another
    # dev-dependency stops building on 1.77, add it to these lines.
    # Scope: the lib unit tests of both crates. Integration tests,
    # examples and benches are not built here.
    - name: Strip dev-dependencies that need a newer toolchain
      run: |
        cargo remove --dev -p rsproperties clap criterion
        cargo remove --dev -p rsproperties-service clap

    # send() (client) and send_response() (service) must not fall back to
    # std's UnixStream::write, a plain write(2) — SIGPIPE — on 1.77..=1.86.
    # Current stable passes those regression tests either way, so they run
    # here.
    - name: Lib unit tests on MSRV
      run: |
        cargo test --locked --lib -p rsproperties --features builder
        cargo test --locked --lib -p rsproperties-service --features builder

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      uses: taiki-e/install-action@cargo-audit

    - name: Run security audit
      run: cargo audit

    - name: Check for outdated dependencies
      run: |
        cargo install cargo-outdated || echo "cargo-outdated already installed"
        cargo outdated --exit-code 1

  android:
    name: Android Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
          - i686-linux-android
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools platforms;android-34 ndk;26.1.10909125

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-android-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-android-${{ matrix.target }}-
          ${{ runner.os }}-cargo-android-

    # `-p rsproperties`: rsproperties-service compiles only for Linux (see
    # the last step of this job).
    - name: Build for Android (${{ matrix.target }})
      run: |
        export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
        cargo ndk --target ${{ matrix.target }} --platform 21 build -p rsproperties --all-features

    - name: Build examples for Android (${{ matrix.target }})
      run: |
        export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
        cargo ndk --target ${{ matrix.target }} --platform 21 build -p rsproperties --examples --all-features

    - name: Check workspace for Android (${{ matrix.target }})
      run: |
        export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
        cd rsproperties
        cargo ndk --target ${{ matrix.target }} --platform 21 check --all-features

    # rsproperties-service is Linux-only: its compile_error! must fire on
    # Android. One target is enough; the cfg does not depend on the arch.
    - name: Service refuses to build for Android
      if: matrix.target == 'x86_64-linux-android'
      run: |
        export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
        if cargo ndk --target ${{ matrix.target }} --platform 21 check -p rsproperties-service 2> err.txt; then
          echo "rsproperties-service unexpectedly built for Android"; exit 1
        fi
        grep -q "builds only for" err.txt

  # Linux targets without 64-bit atomics (no `AtomicU64`). The client must
  # build there; rsproperties-service does not (rsactor uses `AtomicU64`).
  linux-32bit:
    name: Client check on ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - armv5te-unknown-linux-gnueabi
          - powerpc-unknown-linux-gnu
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Check rsproperties (${{ matrix.target }})
      run: cargo check -p rsproperties --all-features --target ${{ matrix.target }}

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-docs-

    - name: Build documentation
      run: cargo doc --all-features --no-deps --document-private-items

    - name: Check documentation
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --all-features --no-deps --document-private-items
