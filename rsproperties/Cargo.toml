[package]
name = "rsproperties"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Pure Rust implementation of Android's property system for Linux and Android, with real-time monitoring and Linux emulation"

[features]
default = []
builder = []
# Enforce the root-ownership check on property files even in builds with
# debug-assertions enabled (which normally relax it for dev/test). For
# release profiles that turn `debug-assertions = true` back on (e.g. for
# overflow checks) without intending to relax file validation.
# Also refuses (`Error::PermissionDenied`) a `property_info` whose
# owner-write bit is set, in every build; without this feature such a
# file is only logged with a warning. `property_info` must be replaced by
# rename, never rewritten in place (`AreaWriterLock::publish_property_info`
# writes it with mode 0444).
strict-file-validation = []

# docs.rs documents the `builder` API too, and `--cfg docsrs` turns on
# `doc_cfg` in lib.rs, which labels each item with the feature it needs.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
rustix.workspace = true
log.workspace = true
zerocopy.workspace = true
zerocopy-derive.workspace = true
thiserror.workspace = true
pretty-hex.workspace = true

[dev-dependencies]
android_system_properties.workspace = true
env_logger.workspace = true
anyhow.workspace = true
clap.workspace = true
criterion = "0.8"
libc = "0.2"

[[bench]]
name = "props_bench"
harness = false
required-features = ["builder"]

