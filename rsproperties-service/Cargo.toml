[package]
name = "rsproperties-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Linux emulation of the Android system property service (not usable on Android)"
# Not released to crates.io — consumed via git/path only.
publish = false

[features]
builder = ["rsproperties/builder"]

[dependencies]
rsproperties = { path = "../rsproperties", features = ["builder"] }
rustix.workspace = true
log.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
rsactor.workspace = true

[dev-dependencies]
env_logger.workspace = true
ctrlc.workspace = true
anyhow.workspace = true
clap.workspace = true
libc = "0.2"

[[example]]
name = "example_service"
