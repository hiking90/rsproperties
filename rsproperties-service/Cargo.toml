[package]
name = "rsproperties-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/rsproperties-service"
keywords.workspace = true
# Not the workspace's "api-bindings": the service binds no foreign API.
categories = ["os::linux-apis", "development-tools::testing"]
description = "Linux emulation of the Android system property service, also for Android userspaces without init's property service"

# docs.rs builds the Linux target only.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
rsproperties = { version = "0.7.0", path = "../rsproperties", features = ["builder"] }
rustix.workspace = true
log.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
rsactor.workspace = true
# `getsockopt` for the peer options `rustix` has no accessor for
# (`peer_sockopt.rs`). 0.2.174 has `SO_PEERPIDFD`.
libc = "0.2.174"

[dev-dependencies]
# `asynchronous::set` against a running service.
rsproperties = { version = "0.7.0", path = "../rsproperties", features = ["builder", "tokio"] }
env_logger.workspace = true
ctrlc.workspace = true
anyhow.workspace = true
clap.workspace = true

[[example]]
name = "example_service"
