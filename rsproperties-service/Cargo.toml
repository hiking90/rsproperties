[package]
name = "rsproperties-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rsproperties-service"
keywords.workspace = true
# Not the workspace's "api-bindings": the service binds no foreign API.
categories = ["os::linux-apis", "development-tools::testing"]
description = "Linux emulation of the Android system property service (not usable on Android)"

# The service builds on Linux only.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
rsproperties = { version = "0.7.0", path = "../rsproperties", features = ["builder"] }
rustix.workspace = true
log.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
rsactor.workspace = true

[dev-dependencies]
# `asynchronous::set` against a running service.
rsproperties = { version = "0.7.0", path = "../rsproperties", features = ["builder", "tokio"] }
env_logger.workspace = true
ctrlc.workspace = true
anyhow.workspace = true
clap.workspace = true
libc = "0.2"

[[example]]
name = "example_service"
